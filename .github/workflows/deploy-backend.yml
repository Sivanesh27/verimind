# Tests the backend and deploys it to the Oracle Cloud VM whenever backend code changes on main.
# Setup (once): GitHub repo -> Settings -> Secrets and variables -> Actions -> Secrets:
#   ORACLE_HOST     public IP of the VM
#   ORACLE_USER     ubuntu
#   ORACLE_SSH_KEY  contents of the private key file you downloaded when creating the VM
name: Deploy backend to Oracle Cloud

on:
  push:
    branches: [main]
    paths: ['backend/**', 'deploy/oracle/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::error::Add ORACLE_HOST, ORACLE_USER and ORACLE_SSH_KEY secrets (see deployment.md)"; exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          script: bash ~/verimind/deploy/oracle/deploy.sh
