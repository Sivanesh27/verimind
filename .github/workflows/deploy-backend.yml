# Deploys backend/ to a free Hugging Face Docker Space whenever it changes on main.
# Setup (once): GitHub repo -> Settings -> Secrets and variables -> Actions
#   Secret   HF_TOKEN  = Hugging Face access token with "write" permission
#   Variable HF_SPACE  = <hf-username>/<space-name>   e.g. alice/verimind-api
name: Deploy backend to Hugging Face

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push backend to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Set the HF_TOKEN secret and HF_SPACE variable (see docs/DEPLOYMENT.md)"; exit 1
          fi
          mkdir -p /tmp/space
          cp -r backend/. /tmp/space/
          rm -rf /tmp/space/node_modules /tmp/space/reports /tmp/space/.env

          # Hugging Face reads the Space configuration from README front matter.
          cat > /tmp/space/README.md <<'EOF'
          ---
          title: VeriMind API
          emoji: 🛡️
          colorFrom: indigo
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          ---

          Backend of VeriMind, a trust-aware AI agent. Deployed automatically from GitHub; do not edit here.
          EOF
          sed -i 's/^          //' /tmp/space/README.md

          cd /tmp/space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
