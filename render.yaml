# Render Blueprint — free web service for the VeriMind API.
# Render dashboard -> New -> Blueprint -> select this repository.
# The LLM runs on Mistral's free API (Experiment plan), so the backend fits Render's free 512 MB instance.
services:
  - type: web
    name: verimind-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mistral
      - key: LLM_API_BASE_URL
        value: https://api.mistral.ai/v1
      - key: LLM_API_MODEL
        value: ministral-8b-latest
      - key: LLM_API_MIN_INTERVAL_MS
        value: "1100"
      - key: LLM_SAMPLES
        value: "1"
      # The local model engine is not used on Render; skip its post-install download/build.
      - key: NODE_LLAMA_CPP_SKIP_DOWNLOAD
        value: "true"
      - key: CONFIDENCE_HIGH
        value: "0.8"
      - key: CONFIDENCE_MEDIUM
        value: "0.55"
      # Secrets / per-deployment values — entered in the Render dashboard, never stored in git.
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
